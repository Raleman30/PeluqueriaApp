<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estilistas - Peluquería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4">💇 Gestión de Estilistas</h2>

        <!-- Formulario agregar -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Agregar Estilista</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre completo">
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="telefono" class="form-control" placeholder="Teléfono">
                    </div>
                    <div class="col-md-3">
                        <input type="email" id="email" class="form-control" placeholder="Email">
                    </div>
                    <div class="col-md-2">
                        <select id="especialidadId" class="form-select">
                            <option value="">Especialidad</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="agregar()">Agregar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario editar -->
        <div class="card mb-4" id="formEditar" style="display:none;">
            <div class="card-header bg-warning text-dark">Editar Estilista</div>
            <div class="card-body">
                <input type="hidden" id="editId">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="editNombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="editTelefono" class="form-control" placeholder="Teléfono">
                    </div>
                    <div class="col-md-3">
                        <input type="email" id="editEmail" class="form-control" placeholder="Email">
                    </div>
                    <div class="col-md-2">
                        <select id="editEspecialidadId" class="form-select">
                            <option value="">Especialidad</option>
                        </select>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-warning w-100" onclick="actualizar()">Guardar</button>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-secondary w-100" onclick="cancelarEdicion()">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista -->
        <div class="card">
            <div class="card-header bg-dark text-white">Lista de Estilistas</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Especialidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEstilistas"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    const apiUrl = 'http://localhost:5002/api/Estilista';
    const apiEspecialidades = 'http://localhost:5002/api/Especialidad';

    async function cargarEspecialidades() {
        const response = await fetch(apiEspecialidades);
        const especialidades = await response.json();
        const select = document.getElementById('especialidadId');
        const selectEdit = document.getElementById('editEspecialidadId');
        especialidades.forEach(e => {
            select.innerHTML += `<option value="${e.especialidadId}">${e.nombre}</option>`;
            selectEdit.innerHTML += `<option value="${e.especialidadId}">${e.nombre}</option>`;
        });
    }

    async function cargarEstilistas() {
        const response = await fetch(apiUrl);
        const estilistas = await response.json();
        const tabla = document.getElementById('tablaEstilistas');
        tabla.innerHTML = '';
        estilistas.forEach(e => {
            tabla.innerHTML += `
                <tr>
                    <td>${e.estilistaId}</td>
                    <td>${e.nombre}</td>
                    <td>${e.telefono}</td>
                    <td>${e.email}</td>
                    <td>${e.especialidadId}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editar(${e.estilistaId}, '${e.nombre}', '${e.telefono}', '${e.email}', ${e.especialidadId})">Editar</button>
                        <button class="btn btn-danger btn-sm" onclick="eliminar(${e.estilistaId})">Eliminar</button>
                    </td>
                </tr>`;
        });
    }

    async function agregar() {
        const nombre = document.getElementById('nombre').value;
        const telefono = document.getElementById('telefono').value;
        const email = document.getElementById('email').value;
        const especialidadId = document.getElementById('especialidadId').value;
        if (!nombre || !telefono || !email || !especialidadId) { alert('Complete todos los campos'); return; }
        await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, telefono, email, especialidadId: parseInt(especialidadId) })
        });
        document.getElementById('nombre').value = '';
        document.getElementById('telefono').value = '';
        document.getElementById('email').value = '';
        cargarEstilistas();
    }

    function editar(id, nombre, telefono, email, especialidadId) {
        document.getElementById('formEditar').style.display = 'block';
        document.getElementById('editId').value = id;
        document.getElementById('editNombre').value = nombre;
        document.getElementById('editTelefono').value = telefono;
        document.getElementById('editEmail').value = email;
        document.getElementById('editEspecialidadId').value = especialidadId;
    }

    async function actualizar() {
        const id = document.getElementById('editId').value;
        const nombre = document.getElementById('editNombre').value;
        const telefono = document.getElementById('editTelefono').value;
        const email = document.getElementById('editEmail').value;
        const especialidadId = document.getElementById('editEspecialidadId').value;
        await fetch(`${apiUrl}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, telefono, email, especialidadId: parseInt(especialidadId) })
        });
        cancelarEdicion();
        cargarEstilistas();
    }

    function cancelarEdicion() {
        document.getElementById('formEditar').style.display = 'none';
    }

    async function eliminar(id) {
        if (confirm('¿Desea eliminar este estilista?')) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            cargarEstilistas();
        }
    }

    cargarEspecialidades();
    cargarEstilistas();
    </script>

</body>
</html>
