<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Peluquería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-3">
        <a href="index.html" class="btn btn-secondary">⬅️ Volver al menú</a>
    </div>

    <div class="container mt-4">
        <h2 class="mb-4">✂️ Gestión de Clientes</h2>

        <!-- Formulario agregar -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Agregar Cliente</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre completo">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="telefono" class="form-control" placeholder="Teléfono">
                    </div>
                    <div class="col-md-3">
                        <input type="email" id="email" class="form-control" placeholder="Email">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="agregar()">Agregar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario editar -->
        <div class="card mb-4" id="formEditar" style="display:none;">
            <div class="card-header bg-warning text-dark">Editar Cliente</div>
            <div class="card-body">
                <input type="hidden" id="editId">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="editNombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="editTelefono" class="form-control" placeholder="Teléfono">
                    </div>
                    <div class="col-md-3">
                        <input type="email" id="editEmail" class="form-control" placeholder="Email">
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-warning w-100" onclick="actualizar()">Guardar</button>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-secondary w-100" onclick="cancelarEdicion()">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista -->
        <div class="card">
            <div class="card-header bg-dark text-white">Lista de Clientes</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = 'http://localhost:5002/api/Cliente';

        async function cargarClientes() {
            const response = await fetch(apiUrl);
            const clientes = await response.json();
            const tabla = document.getElementById('tablaClientes');
            tabla.innerHTML = '';
            clientes.forEach(c => {
                tabla.innerHTML += `
                    <tr>
                        <td>${c.clienteId}</td>
                        <td>${c.nombre}</td>
                        <td>${c.telefono}</td>
                        <td>${c.email}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editar(${c.clienteId}, '${c.nombre}', '${c.telefono}', '${c.email}')">Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminar(${c.clienteId})">Eliminar</button>
                        </td>
                    </tr>`;
            });
        }

        async function agregar() {
            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const email = document.getElementById('email').value;
            if (!nombre || !telefono || !email) { alert('Complete todos los campos'); return; }
            await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, telefono, email })
            });
            document.getElementById('nombre').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('email').value = '';
            cargarClientes();
        }

        function editar(id, nombre, telefono, email) {
            document.getElementById('formEditar').style.display = 'block';
            document.getElementById('editId').value = id;
            document.getElementById('editNombre').value = nombre;
            document.getElementById('editTelefono').value = telefono;
            document.getElementById('editEmail').value = email;
        }

        async function actualizar() {
            const id = document.getElementById('editId').value;
            const nombre = document.getElementById('editNombre').value;
            const telefono = document.getElementById('editTelefono').value;
            const email = document.getElementById('editEmail').value;
            await fetch(`${apiUrl}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, telefono, email })
            });
            cancelarEdicion();
            cargarClientes();
        }

        function cancelarEdicion() {
            document.getElementById('formEditar').style.display = 'none';
        }

        async function eliminar(id) {
            if (confirm('¿Desea eliminar este cliente?')) {
                await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
                cargarClientes();
            }
        }

        cargarClientes();
    </script>

</body>
</html>
