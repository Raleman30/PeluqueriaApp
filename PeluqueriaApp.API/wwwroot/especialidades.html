<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Especialidades - Peluquería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4">🎨 Gestión de Especialidades</h2>

        <!-- Formulario agregar -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Agregar Especialidad</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-10">
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre de la especialidad">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="agregar()">Agregar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario editar -->
        <div class="card mb-4" id="formEditar" style="display:none;">
            <div class="card-header bg-warning text-dark">Editar Especialidad</div>
            <div class="card-body">
                <input type="hidden" id="editId">
                <div class="row g-3">
                    <div class="col-md-10">
                        <input type="text" id="editNombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-warning w-100" onclick="actualizar()">Guardar</button>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-secondary w-100" onclick="cancelarEdicion()">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista -->
        <div class="card">
            <div class="card-header bg-dark text-white">Lista de Especialidades</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEspecialidades"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    const apiUrl = 'http://localhost:5002/api/Especialidad';

    async function cargarEspecialidades() {
        const response = await fetch(apiUrl);
        const especialidades = await response.json();
        const tabla = document.getElementById('tablaEspecialidades');
        tabla.innerHTML = '';
        especialidades.forEach(e => {
            tabla.innerHTML += `
                <tr>
                    <td>${e.especialidadId}</td>
                    <td>${e.nombre}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editar(${e.especialidadId}, '${e.nombre}')">Editar</button>
                        <button class="btn btn-danger btn-sm" onclick="eliminar(${e.especialidadId})">Eliminar</button>
                    </td>
                </tr>`;
        });
    }

    async function agregar() {
        const nombre = document.getElementById('nombre').value;
        if (!nombre) { alert('Ingrese el nombre'); return; }
        await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre })
        });
        document.getElementById('nombre').value = '';
        cargarEspecialidades();
    }

    function editar(id, nombre) {
        document.getElementById('formEditar').style.display = 'block';
        document.getElementById('editId').value = id;
        document.getElementById('editNombre').value = nombre;
    }

    async function actualizar() {
        const id = document.getElementById('editId').value;
        const nombre = document.getElementById('editNombre').value;
        await fetch(`${apiUrl}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre })
        });
        cancelarEdicion();
        cargarEspecialidades();
    }

    function cancelarEdicion() {
        document.getElementById('formEditar').style.display = 'none';
    }

    async function eliminar(id) {
        if (confirm('¿Desea eliminar esta especialidad?')) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            cargarEspecialidades();
        }
    }

    cargarEspecialidades();
    </script>

</body>
</html>
