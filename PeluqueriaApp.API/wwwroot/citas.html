<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas - Peluquería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4">📅 Gestión de Citas</h2>

        <!-- Formulario agregar -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">Agregar Cita</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <select id="clienteId" class="form-select">
                            <option value="">Seleccione Cliente</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="estilistaId" class="form-select">
                            <option value="">Seleccione Estilista</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" id="fechaCita" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <input type="time" id="horaCita" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="agregar()">Agregar</button>
                    </div>
                    <div class="col-md-12">
                        <input type="text" id="notas" class="form-control" placeholder="Notas (opcional)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario editar -->
        <div class="card mb-4" id="formEditar" style="display:none;">
            <div class="card-header bg-warning text-dark">Editar Cita</div>
            <div class="card-body">
                <input type="hidden" id="editId">
                <div class="row g-3">
                    <div class="col-md-3">
                        <select id="editClienteId" class="form-select"></select>
                    </div>
                    <div class="col-md-3">
                        <select id="editEstilistaId" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <input type="date" id="editFechaCita" class="form-control">
                    </div>
                    <div class="col-md-2">
                        <input type="time" id="editHoraCita" class="form-control">
                    </div>
                    <div class="col-md-1">
                        <select id="editEstado" class="form-select">
                            <option value="1">Activa</option>
                            <option value="2">Cancelada</option>
                            <option value="3">Completada</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <input type="text" id="editNotas" class="form-control" placeholder="Notas">
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-warning w-100" onclick="actualizar()">Guardar</button>
                    </div>
                    <div class="col-md-1">
                        <button class="btn btn-secondary w-100" onclick="cancelarEdicion()">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lista -->
        <div class="card">
            <div class="card-header bg-dark text-white">Lista de Citas</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Estilista</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Notas</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCitas"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    const apiUrl = 'http://localhost:5002/api/Cita';
    const apiClientes = 'http://localhost:5002/api/Cliente';
    const apiEstilistas = 'http://localhost:5002/api/Estilista';

    const estados = { 1: '✅ Activa', 2: '❌ Cancelada', 3: '✔️ Completada' };

    async function cargarSelects() {
        const clientes = await (await fetch(apiClientes)).json();
        const estilistas = await (await fetch(apiEstilistas)).json();

        ['clienteId', 'editClienteId'].forEach(id => {
            const select = document.getElementById(id);
            clientes.forEach(c => select.innerHTML += `<option value="${c.clienteId}">${c.nombre}</option>`);
        });

        ['estilistaId', 'editEstilistaId'].forEach(id => {
            const select = document.getElementById(id);
            estilistas.forEach(e => select.innerHTML += `<option value="${e.estilistaId}">${e.nombre}</option>`);
        });
    }

    async function cargarCitas() {
        const response = await fetch(apiUrl);
        const citas = await response.json();
        const tabla = document.getElementById('tablaCitas');
        tabla.innerHTML = '';
        citas.forEach(c => {
            tabla.innerHTML += `
                <tr>
                    <td>${c.citaId}</td>
                    <td>${c.clienteId}</td>
                    <td>${c.estilistaId}</td>
                    <td>${c.fechaCita}</td>
                    <td>${c.horaCita}</td>
                    <td>${c.notas || ''}</td>
                    <td>${estados[c.estado] || c.estado}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editar(${c.citaId}, ${c.clienteId}, ${c.estilistaId}, '${c.fechaCita}', '${c.horaCita}', '${c.notas || ''}', ${c.estado})">Editar</button>
                        <button class="btn btn-danger btn-sm" onclick="eliminar(${c.citaId})">Eliminar</button>
                    </td>
                </tr>`;
        });
    }

    async function agregar() {
        const clienteId = document.getElementById('clienteId').value;
        const estilistaId = document.getElementById('estilistaId').value;
        const fechaCita = document.getElementById('fechaCita').value;
        const horaCita = document.getElementById('horaCita').value;
        const notas = document.getElementById('notas').value;
        if (!clienteId || !estilistaId || !fechaCita || !horaCita) { alert('Complete los campos requeridos'); return; }
        await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clienteId: parseInt(clienteId), estilistaId: parseInt(estilistaId), fechaCita, horaCita, notas })
        });
        cargarCitas();
    }

    function editar(id, clienteId, estilistaId, fechaCita, horaCita, notas, estado) {
        document.getElementById('formEditar').style.display = 'block';
        document.getElementById('editId').value = id;
        document.getElementById('editClienteId').value = clienteId;
        document.getElementById('editEstilistaId').value = estilistaId;
        document.getElementById('editFechaCita').value = fechaCita;
        document.getElementById('editHoraCita').value = horaCita;
        document.getElementById('editNotas').value = notas;
        document.getElementById('editEstado').value = estado;
    }

    async function actualizar() {
        const id = document.getElementById('editId').value;
        const clienteId = document.getElementById('editClienteId').value;
        const estilistaId = document.getElementById('editEstilistaId').value;
        const fechaCita = document.getElementById('editFechaCita').value;
        const horaCita = document.getElementById('editHoraCita').value;
        const notas = document.getElementById('editNotas').value;
        const estado = document.getElementById('editEstado').value;
        await fetch(`${apiUrl}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ clienteId: parseInt(clienteId), estilistaId: parseInt(estilistaId), fechaCita, horaCita, notas, estado: parseInt(estado) })
        });
        cancelarEdicion();
        cargarCitas();
    }

    function cancelarEdicion() {
        document.getElementById('formEditar').style.display = 'none';
    }

    async function eliminar(id) {
        if (confirm('¿Desea eliminar esta cita?')) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            cargarCitas();
        }
    }

    cargarSelects();
    cargarCitas();
    </script>

</body>
</html>
